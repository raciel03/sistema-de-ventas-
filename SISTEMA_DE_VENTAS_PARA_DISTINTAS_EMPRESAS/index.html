<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Ventas</title>
  <meta name="description" content="Sistema de ventas e inventario para el control de stock, caja y comprobantes." />
  <meta name="theme-color" content="#0f172a" />

  <meta property="og:title" content="Sistema de Ventas" />
  <meta property="og:description" content="Control de ventas, stock y caja." />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary" />
</head>

<body>
  <script>
    (function() {
      try {
        var total = 0;
        for (var i = 0; i < localStorage.length; i++) {
          total += (localStorage.getItem(localStorage.key(i)) || '').length;
        }
        // Limpieza de cache viejo cuando el almacenamiento se llena.
        // NUNCA se borran las colas *-pending: son datos que aun no llegaron a
        // Supabase y borrarlas hacia desaparecer ventas/historial sin conexion.
        if (total > 3000000) {
          try { localStorage.removeItem('pos-sales'); } catch(e){}
          try { localStorage.removeItem('pos-stock-history'); } catch(e){}
        }
      } catch(e) {}
    })();
  </script>
  <style>
    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, Arial, sans-serif;
      color: #e2e8f0;
      background: #020617
    }

    #boot-status.hidden {
      display: none
    }

    #boot-status.error {
      background: #fff5f5;
      color: #7f1d1d
    }

    #boot-status .box {
      padding: 16px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      color: #0f172a;
      background: #fff
    }

    #boot-status .boot-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px
    }

    #boot-status .boot-svg {
      width: 128px;
      height: 128px
    }

    #boot-status .boot-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #94a3b8
    }

    @keyframes bootSpin { 0% { transform: rotate(0) } 60% { transform: rotate(520deg) } 75%, 100% { transform: rotate(720deg) } }
    @keyframes bootDash {
      0% { stroke-dasharray: 65 240; stroke-dashoffset: 0; stroke: #4F46E5 }
      50% { stroke-dasharray: 180 125; stroke-dashoffset: -90; stroke: #6366F1 }
      70% { stroke-dasharray: 310 0; stroke-dashoffset: -180; stroke: #10B981 }
      85%, 100% { stroke-dasharray: 310 0; stroke-dashoffset: -180; stroke: #10B981; opacity: .2 }
    }
    @keyframes bootStoreOut {
      0%, 55% { transform: scale(1); opacity: 1 }
      68% { transform: scale(.65); opacity: 0 }
      94% { transform: scale(.65); opacity: 0 }
      100% { transform: scale(1); opacity: 1 }
    }
    @keyframes bootCheckIn {
      0%, 62% { transform: scale(.5); opacity: 0 }
      72% { transform: scale(1.08); opacity: 1 }
      80%, 93% { transform: scale(1); opacity: 1 }
      98%, 100% { transform: scale(.6); opacity: 0 }
    }
    @keyframes bootDrawCheck {
      0%, 65% { stroke-dashoffset: 28; opacity: 0 }
      74% { opacity: 1 }
      82%, 94% { stroke-dashoffset: 0; opacity: 1 }
      98%, 100% { stroke-dashoffset: 28; opacity: 0 }
    }
    @keyframes bootPulseBurst {
      0%, 66% { transform: scale(.85); opacity: 0 }
      72% { opacity: .6 }
      84% { transform: scale(1.28); opacity: 0 }
      100% { opacity: 0 }
    }

    .boot-orbit { transform-origin: 80px 80px; animation: bootSpin 4.8s cubic-bezier(.4,0,.2,1) infinite }
    .boot-arc { animation: bootDash 4.8s cubic-bezier(.4,0,.2,1) infinite }
    .boot-store { transform-origin: 80px 80px; animation: bootStoreOut 4.8s cubic-bezier(.4,0,.2,1) infinite }
    .boot-check { transform-origin: 80px 80px; animation: bootCheckIn 4.8s cubic-bezier(.34,1.56,.64,1) infinite }
    .boot-check-path { stroke-dasharray: 28; animation: bootDrawCheck 4.8s cubic-bezier(.4,0,.2,1) infinite }
    .boot-burst { transform-origin: 80px 80px; animation: bootPulseBurst 4.8s ease-out infinite }
  </style>
  <div id="boot-status">
    <div class="boot-wrap">
      <svg class="boot-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bootOrbitGrad" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#06B6D4" />
          </linearGradient>
          <filter id="bootGlow" height="140%" width="140%" x="-20%" y="-20%">
            <feGaussianBlur result="blur" stdDeviation="2.5" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <circle cx="80" cy="80" fill="#0b1220" r="64" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="80" cy="80" fill="none" r="52" stroke="#1e293b" stroke-width="2.5" />
        <circle class="boot-burst" cx="80" cy="80" fill="none" r="52" stroke="#10B981" stroke-width="2" />

        <g class="boot-orbit">
          <circle class="boot-arc" cx="80" cy="80" fill="none" r="52" stroke="url(#bootOrbitGrad)" stroke-linecap="round" stroke-width="3.5" />
          <circle cx="132" cy="80" fill="#38BDF8" filter="url(#bootGlow)" opacity="0.9" r="2.8" />
        </g>

        <g class="boot-store">
          <rect fill="#4F46E5" filter="url(#bootGlow)" height="56" rx="16" width="56" x="52" y="52" />
          <g transform="translate(64, 64) scale(1.333)">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M2 7h20" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </g>
        </g>

        <g class="boot-check">
          <circle cx="80" cy="80" fill="#fff" filter="url(#bootGlow)" r="28" stroke="#1e293b" stroke-width="1" />
          <circle cx="80" cy="80" fill="#10B981" r="24" />
          <path class="boot-check-path" d="M71 80.5 L77.5 86.5 L89.5 73.5" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" />
        </g>
      </svg>
      <div class="boot-text">Cargando aplicación…</div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      function showError(message) {
        var b = document.getElementById('boot-status');
        if (b) {
          b.classList.remove('hidden');
          b.className = 'error';
          b.innerHTML = '<div class="box">Error al iniciar: ' + message + '</div>';
        }
      }
      window.addEventListener('error', function (e) {
        var msg = (e.error && e.error.message) ? e.error.message : (e.message || 'Revisa la consola del navegador');
        showError(msg);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && (e.reason.message || e.reason.toString())) ? (e.reason.message || e.reason.toString()) : 'Promesa rechazada sin capturar';
        showError(msg);
      });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
